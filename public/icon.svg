<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1026"/>
      <stop offset="50%" stop-color="#0f1f42"/>
      <stop offset="100%" stop-color="#070c1b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Shield Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Glowing Circuit & Ledger Hexagon -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="12 8" opacity="0.4"/>
  
  <!-- Stylized J & Financial Ledger Nodes -->
  <g filter="url(#glow)">
    <!-- Main J bar and curve -->
    <path d="M 310 140 L 310 290 C 310 355 255 385 195 365 C 160 350 145 320 145 320" fill="none" stroke="url(#cyanGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Top Ledger Accent -->
    <line x1="220" y1="140" x2="350" y2="140" stroke="url(#cyanGrad)" stroke-width="32" stroke-linecap="round"/>
    
    <!-- Currency / Ledger Horizontal Accents -->
    <line x1="190" y1="210" x2="330" y2="210" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>
    <line x1="210" y1="260" x2="310" y2="260" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>
    
    <!-- AI Indicator Nodes -->
    <circle cx="360" cy="220" r="10" fill="#22d3ee"/>
    <circle cx="150" cy="240" r="8" fill="#818cf8"/>
    <circle cx="330" cy="350" r="9" fill="#06b6d4"/>
  </g>
  
  <!-- Bottom Text Emblem -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="6">JERRY AI</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="4">ACCOUNTANT</text>
</svg>
